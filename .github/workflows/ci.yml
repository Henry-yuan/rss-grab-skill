name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装测试依赖
        # 单测不依赖 mlx-whisper（仅 Apple Silicon，Linux runner 装不上）。
        # PyYAML **必须装**：test_audit_frontmatter 直接 import yaml，缺它会在
        # collection 阶段就 ImportError，整个 pytest 报 INTERNALERROR
        # —— 不是「某个测试失败」，是「一个都没跑起来」，最坏的失败形态。
        # 2026-10-14 实测：GitHub runner 镜像不再自带 PyYAML，CI 首次因此全红。
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.0" "PyYAML>=6.0" pytest

      - name: 跑单测
        run: python -m pytest .agents/skills/rss-grab/scripts/tests/ .agents/skills/_shared/tests/ -v
